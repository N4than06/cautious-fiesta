; =====================================================================
;  AT4X Garage - settings for the GMC Sierra AT4X add-on
;  Everything here can be edited while the game is closed.
;  Lines marked (auto) are rewritten by tools/build.py to match src/parts.json.
; =====================================================================

[General]
; Key that opens the garage menu (any System.Windows.Forms.Keys name, e.g. F7, F9, NumPad5).
MenuKey=F7
; Model name of the truck (must match vehicles.meta).
Model=at4x
; true = menu only works while sitting in the AT4X. false = tune any vehicle.
OnlyInAT4X=false
; Re-apply your saved "Active" build automatically every time you get into an AT4X.
AutoApplyBuild=true

[PowerRails]
; Deploy the power rails automatically when a door opens or you walk up to enter.
AutoDeploy=true
; Running-board part sequences, retracted>...>deployed (part indices in the Running Boards slot). (auto)
Sequences=1>2>3,4>5>6
; Milliseconds between animation frames.
FrameMs=90
; How long the rails stay out after the last door closes.
RetractDelayMs=1500
; Rails retract above this speed (km/h) no matter what.
MaxSpeedKph=8

[Whipple]
; Part indices used by the one-click Whipple package. (auto)
SuperchargerIndex=0
HoodIndex=3
IntakeIndex=2
; Boost presets: name:torque multiplier. Stock L87 = 420 hp; ~1.6 is roughly a 700 hp Whipple build.
Boost=6 psi (550 hp):1.30,9 psi (620 hp):1.45,12 psi (700 hp):1.60,14 psi E85 (800 hp):1.80
; Default boost preset index for the package (0 = first entry above).
DefaultBoost=2
; Engine sound used when the Whipple package is installed. Put an add-on sound pack's name here for a real blower whine.
Sound=GAUNTLET4
; Extra top speed (%) while supercharged.
TopSpeedPercent=6

[Sounds]
; Engine sound restored by "Stock" (should match audioNameHash in vehicles.meta).
Stock=SANDKING
; Engine sound presets: AUDIONAME:Label. Any vanilla vehicle audio name works, and so does
; the name of any add-on engine sound pack you have installed.
Presets=SANDKING:Big-Block V8 Truck (default),CARACARA2:Off-Road Super Truck,KAMACHO:Lifted 4x4,EVERON:Desert Runner,TROPHYTRUCK:Trophy Truck,DOMINATOR:Classic Pushrod V8,DUKES:Muscle V8,GAUNTLET4:Supercharged V8,BUFFALO4:Supercharged Sedan V8,BISON:Work Truck V8

[Names]
; Names shown for performance upgrades (stat mods have no model, so they are named here).
Engine=Stage 1 - ECU Tune,Stage 2 - Intake + Headers,Stage 3 - Built Bottom End,Stage 4 - Race Fuel Tune
Brakes=Street Big Brake Kit,6-Piston Big Brake Kit,Race Carbon Ceramics
Transmission=Shift Kit + Tune,Built 10-Speed,Competition Valve Body
Suspension=4in Lift (Long Travel),2in Leveling Kit,1in Drop,2in Drop
Armor=20% Armor,40% Armor,60% Armor,80% Armor,100% Armor

[Paint]
; Factory-style colors: Label:R,G,B separated by '|'. Add your own.
Colors=Summit White:236,237,235|Onyx Black:12,12,14|Sterling Metallic:170,173,176|Thunderstorm Gray:84,88,92|Dark Ash Metallic:62,64,66|Volcanic Red Tintcoat:118,14,20|Downpour Metallic:63,84,102|Desert Sand Metallic:176,158,124|Hunter Metallic:52,62,46|Satin Steel:128,131,133|Matte Army Green:72,78,52|Safety Orange:236,96,16

; Saved builds live in AT4XGarage.builds.ini (written by the in-game "Save Build" option).
